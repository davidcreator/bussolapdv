name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Testes e análise (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Dependências de sistema para o Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon0 libxkbcommon-x11-0 libgl1 libegl1 libfontconfig1 libdbus-1-3

      - name: Instalar projeto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tipagem (mypy)
        run: mypy
        continue-on-error: false

      - name: Testes
        run: pytest -q --cov=src/bussola_pdv --cov-report=term-missing --junitxml=relatorio-testes.xml

      # Sem isto, uma falha na suíte aparecia no Actions apenas como
      # "Process completed with exit code 1", sem o nome do teste.
      - name: Anotar falhas de teste
        if: failure()
        run: python ferramentas/anotar_falhas.py relatorio-testes.xml

      - name: Guardar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes-linux-${{ matrix.python }}
          path: relatorio-testes.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Verificação de migrações e integridade
        run: |
          python -m bussola_pdv.cli demo --banco /tmp/ci.db --forcar
          python -m bussola_pdv.cli info --banco /tmp/ci.db
          python -m bussola_pdv.cli backup --banco /tmp/ci.db --destino /tmp/copias/
